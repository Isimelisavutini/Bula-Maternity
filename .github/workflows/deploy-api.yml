name: Deploy CSharp API
on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: azure-api-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.AZURE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: azure-production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: carefiji-api
          path: api
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Confirm .NET 10 App Service runtime
        run: az webapp list-runtimes --os linux --output tsv | grep -i 'DOTNETCORE:10.0'
      - name: Resolve Azure endpoint hostnames
        id: endpoints
        env:
          API_NAME: ${{ vars.AZURE_API_APP_NAME }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          staging_host=$(az webapp show --resource-group "$RESOURCE_GROUP" --name "$API_NAME" --slot staging --query defaultHostName --output tsv)
          production_host=$(az webapp show --resource-group "$RESOURCE_GROUP" --name "$API_NAME" --query defaultHostName --output tsv)
          echo "staging_url=https://$staging_host" >> "$GITHUB_OUTPUT"
          echo "production_url=https://$production_host" >> "$GITHUB_OUTPUT"
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_API_APP_NAME }}
          slot-name: staging
          package: api
      - name: Check staging readiness
        env:
          STAGING_URL: ${{ steps.endpoints.outputs.staging_url }}
        run: curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "$STAGING_URL/health/ready"
      - name: Swap verified build into production
        env:
          API_NAME: ${{ vars.AZURE_API_APP_NAME }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: az webapp deployment slot swap --resource-group "$RESOURCE_GROUP" --name "$API_NAME" --slot staging --target-slot production
      - name: Check production and roll back on failure
        env:
          API_NAME: ${{ vars.AZURE_API_APP_NAME }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          PRODUCTION_URL: ${{ steps.endpoints.outputs.production_url }}
        run: |
          if ! curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 5 "$PRODUCTION_URL/health/ready"; then
            az webapp deployment slot swap --resource-group "$RESOURCE_GROUP" --name "$API_NAME" --slot staging --target-slot production
            exit 1
          fi
